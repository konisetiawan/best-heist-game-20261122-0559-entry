<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b13">
  <title>The Velvet Vault — a museum heist in the dark</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #090b13; }
    body { display: grid; place-items: center; min-height: 100vh; overflow: hidden; }
    canvas { width: min(100vw, 177.7778vh); height: min(56.25vw, 100vh); display: block; background: #10131c; box-shadow: 0 18px 80px #000b; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720" aria-label="The Velvet Vault stealth game"></canvas>
  <script type="module" src="./main.js"></script>
</body>
</html>
